name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer commit on the same branch or PR cancels the run in progress
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Throwaway key: CI only runs tests, nothing is deployed
  DJANGO_SECRET_KEY: ci-only-insecure-key

jobs:
  backend:
    name: API tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt coverage

      - name: Django system checks
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests with coverage
        run: coverage run manage.py test

      - name: Coverage report
        run: |
          coverage report
          echo "### Cobertura del backend (Python ${{ matrix.python-version }})" >> "$GITHUB_STEP_SUMMARY"
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run build

  e2e:
    name: E2E tests (Selenium)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      HEADLESS: "true"
      DJANGO_DEBUG: "True"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            selenium-django-vue-tests/requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Fresh SQLite database on every run
      - name: Start backend
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python manage.py migrate
          nohup python manage.py runserver 127.0.0.1:8000 --noreload > ../backend.log 2>&1 &

      # E2E tests run against the production build, not the dev server
      - name: Build and serve frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          nohup npx vite preview --port 5173 --strictPort > ../frontend.log 2>&1 &

      - name: Wait for servers
        run: |
          curl -sf --retry 30 --retry-connrefused --retry-delay 1 -o /dev/null http://127.0.0.1:8000/api/products/
          curl -sf --retry 30 --retry-connrefused --retry-delay 1 -o /dev/null http://localhost:5173/

      - name: Run E2E tests
        working-directory: selenium-django-vue-tests
        run: |
          pip install -r requirements.txt
          pytest

      # HTML report (with screenshots of failed tests) and server logs
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            selenium-django-vue-tests/reports/
            backend.log
            frontend.log
          if-no-files-found: ignore
          retention-days: 14
